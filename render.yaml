services:
  - type: web
    name: activemetrics-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # você cola a URL do Supabase manualmente
      - key: FRONTEND_URL
        sync: false        # você cola a URL do Vercel manualmente
